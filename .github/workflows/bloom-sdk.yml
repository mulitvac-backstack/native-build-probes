name: Bloom tested native SDKs
on:
  workflow_dispatch:
    inputs:
      source_revision:
        description: Exact private Bloom source/recipe revision from pinned profile (40 hex)
        required: true
        type: string
      sdk_version:
        description: SDK SemVer from immutable source input manifest
        required: true
        type: string
permissions:
  contents: read
jobs:
  sdk:
    if: github.event.repository.private == false
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - {runner: ubuntu-24.04, target: x86_64-unknown-linux-gnu}
          - {runner: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu}
          - {runner: windows-2025, target: x86_64-pc-windows-msvc}
          - {runner: windows-11-arm, target: aarch64-pc-windows-msvc}
          - {runner: macos-15-intel, target: x86_64-apple-darwin}
          - {runner: macos-15, target: aarch64-apple-darwin}
    env:
      BLOOM_SDK_CHUNKS: ${{ vars.BLOOM_SDK_CHUNKS }}
      BLOOM_SDK_SHA256: ${{ vars.BLOOM_SDK_SHA256 }}
    steps:
      - name: Read trusted public adapter
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Pinned authenticated SDK envelope dependency
        shell: pwsh
        run: |
          python -m pip install --only-binary=:all: cryptography==46.0.3
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Offline SDK and adapter contracts
        shell: pwsh
        run: |
          python -m unittest -v test_probe.py test_headspace_source_build.py test_headspace_release_build.py test_sdk_artifacts.py test_bloom_profile.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Linux native C prerequisites
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends build-essential cmake ninja-build pkg-config libssl-dev
      - name: macOS native static OpenSSL prerequisite
        if: runner.os == 'macOS'
        shell: bash
        run: |
          brew list --versions openssl@3 >/dev/null || brew install openssl@3
          test -f "$(brew --prefix openssl@3)/lib/libcrypto.a"
      - name: Assemble private SDK chunk 01
        shell: pwsh
        env:
          BLOOM_INPUT_CHUNK: ${{ secrets.BLOOM_SDK_01 }}
        run: |
          python scripts/bloom_profile.py append-input --index 1 --file "$env:RUNNER_TEMP/bloom-sdk-source.b64"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Assemble private SDK chunk 02
        shell: pwsh
        env:
          BLOOM_INPUT_CHUNK: ${{ secrets.BLOOM_SDK_02 }}
        run: |
          python scripts/bloom_profile.py append-input --index 2 --file "$env:RUNNER_TEMP/bloom-sdk-source.b64"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Assemble private SDK chunk 03
        shell: pwsh
        env:
          BLOOM_INPUT_CHUNK: ${{ secrets.BLOOM_SDK_03 }}
