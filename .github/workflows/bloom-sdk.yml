          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Native SDK compile, required semantics and encrypted envelope
        shell: pwsh
        env:
          BLOOM_ARTIFACT_KEY: ${{ secrets.BLOOM_ARTIFACT_KEY }}
          SDK_RECIPE_REVISION: ${{ inputs.source_revision }}
          SDK_VERSION: ${{ inputs.sdk_version }}
          SDK_RUNNER: ${{ matrix.runner }}
        run: |
          python scripts/bloom_sdk_build.py --runner $env:SDK_RUNNER "--revision=$env:SDK_RECIPE_REVISION" "--version=$env:SDK_VERSION" --sdk-file "$env:RUNNER_TEMP/bloom-sdk-source.b64" --output "$env:RUNNER_TEMP/bloom-sdk-dist"
          exit $LASTEXITCODE
      - name: Retain only authenticated encrypted SDK and bounded public receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bloom-sdk-${{ inputs.sdk_version }}-${{ matrix.target }}
          retention-days: 90
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/bloom-sdk-dist/failure-*.aesgcm
            ${{ runner.temp }}/bloom-sdk-dist/failure-*.manifest.json
            ${{ runner.temp }}/bloom-sdk-dist/bloom-sdk-*.aesgcm
            ${{ runner.temp }}/bloom-sdk-dist/bloom-sdk-*.manifest.json
            ${{ runner.temp }}/bloom-sdk-dist/bloom-build-*.json
      - name: Remove only this job's encoded private input
        if: always()
        shell: pwsh
        run: |
          Remove-Item -LiteralPath "$env:RUNNER_TEMP/bloom-sdk-source.b64" -ErrorAction SilentlyContinue
