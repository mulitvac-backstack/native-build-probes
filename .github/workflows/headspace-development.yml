name: Headspace development source and packages
on:
  workflow_dispatch:
    inputs:
      source_revision:
        description: Exact public Gitea Headspace commit (40 hexadecimal characters)
        required: true
        type: string
permissions:
  contents: read
jobs:
  headspace:
    if: github.event.repository.private == false
    name: Headspace / ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        runner:
          - ubuntu-24.04
          - ubuntu-24.04-arm
          - windows-2025
          - windows-11-arm
          - macos-15-intel
          - macos-15
    steps:
      - name: Read public build adapter
        # Official actions/checkout v7.0.1, resolved 2026-10-18.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Test adapter and build native Headspace (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        env:
          HEADSPACE_SOURCE_REVISION: ${{ inputs.source_revision }}
          HEADSPACE_BUILD_RUNNER: ${{ matrix.runner }}
        run: |
          python3 -m unittest -v test_probe.py test_headspace_source_build.py
          python3 scripts/headspace_source_build.py --runner "$HEADSPACE_BUILD_RUNNER" --revision="$HEADSPACE_SOURCE_REVISION" --install-rust
      - name: Test adapter and build native Headspace (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          HEADSPACE_SOURCE_REVISION: ${{ inputs.source_revision }}
          HEADSPACE_BUILD_RUNNER: ${{ matrix.runner }}
        run: |
          python -m unittest -v test_probe.py test_headspace_source_build.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/headspace_source_build.py --runner $env:HEADSPACE_BUILD_RUNNER "--revision=$env:HEADSPACE_SOURCE_REVISION" --install-rust
          exit $LASTEXITCODE
