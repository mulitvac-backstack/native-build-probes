name: Headspace native transfer API checks
on:
  workflow_dispatch:
    inputs:
      source_revision:
        description: Exact public Headspace source revision
        required: true
        type: string
permissions:
  contents: read
jobs:
  interop:
    if: github.event.repository.private == false
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15-intel, macos-15]
    steps:
      - name: Fetch exact public native API harness
        env:
          HEADSPACE_SOURCE_REVISION: ${{ inputs.source_revision }}
        shell: bash
        run: |
          python3 - <<'PYCODE'
          import os, re, subprocess
          from pathlib import Path
          revision = os.environ['HEADSPACE_SOURCE_REVISION']
          if not re.fullmatch(r'[a-f0-9]{40}', revision):
              raise SystemExit('Expected exact lowercase SHA40')
          root = Path(os.environ['RUNNER_TEMP']) / 'headspace-interop'
          root.mkdir()
          subprocess.run(['git', 'init', str(root)], check=True)
          subprocess.run(['git', '-C', str(root), 'fetch', '--depth=1', 'https://git.multivac.network/backstack.io/headspace.git', revision], check=True)
          subprocess.run(['git', '-C', str(root), 'checkout', '--detach', 'FETCH_HEAD'], check=True)
          actual = subprocess.check_output(['git', '-C', str(root), 'rev-parse', 'HEAD'], text=True).strip()
          if actual != revision:
              raise SystemExit('Source identity mismatch')
          PYCODE
      - name: Run production AppKit reader and drag destination fixtures
        shell: bash
        run: |
          rustup toolchain install 1.98.1 --profile minimal
          cd "$RUNNER_TEMP/headspace-interop"
          cargo +1.98.1 run --locked --manifest-path experiments/native-macos-interop/Cargo.toml -- "$RUNNER_TEMP/headspace-native-macos-interop.json"
      - name: Retain bounded native API receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: headspace-native-interop-${{ matrix.runner }}-${{ inputs.source_revision }}
          retention-days: 3
          if-no-files-found: warn
          path: ${{ runner.temp }}/headspace-native-macos-interop.json
