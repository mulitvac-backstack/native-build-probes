name: Headspace trusted native packages
on:
  workflow_dispatch:
    inputs:
      source_revision:
        description: Exact public Gitea Headspace commit (40 hex characters)
        required: true
        type: string
      version:
        description: Exact source Cargo SemVer (for example 0.1.0-alpha.1)
        required: true
        type: string
permissions:
  contents: read
jobs:
  packages:
    if: github.event.repository.private == false
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm, windows-2025, windows-11-arm, macos-15-intel, macos-15]
    env:
      BLOOM_SDK_CHUNKS: ${{ vars.BLOOM_SDK_CHUNKS }}
      BLOOM_SDK_SHA256: ${{ vars.BLOOM_SDK_SHA256 }}
      HEADSPACE_PACKAGE_VERSION: ${{ inputs.version }}
    steps:
      - name: Read trusted public adapter
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Offline adapter contract tests
        shell: pwsh
        run: |
          python -m unittest -v test_probe.py test_headspace_source_build.py test_headspace_release_build.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Linux native build and packaging prerequisites
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends build-essential cmake clang lld llvm pkg-config libasound2-dev libfontconfig-dev libglib2.0-dev libssl-dev libva-dev libvulkan-dev libwayland-dev libx11-xcb-dev libxkbcommon-x11-dev libzstd-dev libsqlite3-dev libstdc++-14-dev libsecret-1-dev libcurl4-openssl-dev libsodium-dev dpkg-dev rpm desktop-file-utils weston mesa-vulkan-drivers
      - name: macOS native static OpenSSL prerequisite
        if: runner.os == 'macOS'
        shell: bash
        run: |
          brew list --versions openssl@3 >/dev/null || brew install openssl@3
          test -f "$(brew --prefix openssl@3)/lib/libcrypto.a"
      - name: Windows pinned WiX installer compiler
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          dotnet tool install --tool-path "$env:RUNNER_TEMP/headspace-tools" wix --version 5.0.2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "$env:RUNNER_TEMP/headspace-tools" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
      - name: Assemble private SDK chunk 01
        shell: pwsh
        env:
          HEADSPACE_SDK_CHUNK: ${{ secrets.BLOOM_SDK_01 }}
        run: |
          python scripts/headspace_release_build.py append-sdk --index 1 --file "$env:RUNNER_TEMP/headspace-sdk.b64"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Assemble private SDK chunk 02
        shell: pwsh
        env:
          HEADSPACE_SDK_CHUNK: ${{ secrets.BLOOM_SDK_02 }}
        run: |
          python scripts/headspace_release_build.py append-sdk --index 2 --file "$env:RUNNER_TEMP/headspace-sdk.b64"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
