name: Headspace six native executables
on:
  workflow_dispatch:
    inputs:
      source_revision:
        description: Exact public Gitea Headspace commit (40 hex characters)
        required: true
        type: string
      version:
        description: Exact source Cargo SemVer (for example 0.1.0-alpha.1)
        required: true
        type: string
permissions:
  contents: read
jobs:
  packages:
    if: github.event.repository.private == false
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm, windows-2025, windows-11-arm, macos-15-intel, macos-15]
    env:
      HEADSPACE_PACKAGE_VERSION: ${{ inputs.version }}
    steps:
      - name: Read trusted public adapter
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Pinned authenticated SDK envelope dependency
        shell: pwsh
        run: |
          python -m pip install --only-binary=:all: cryptography==46.0.3
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Offline adapter contract tests
        shell: pwsh
        run: |
          python -m unittest -v test_probe.py test_headspace_source_build.py test_headspace_release_build.py test_sdk_artifacts.py test_bloom_profile.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Linux native build and GUI-test prerequisites
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends build-essential cmake clang lld llvm pkg-config libasound2-dev libfontconfig-dev libglib2.0-dev libssl-dev libva-dev libvulkan-dev libwayland-dev libx11-xcb-dev libxkbcommon-x11-dev libzstd-dev libsqlite3-dev libstdc++-14-dev libsecret-1-dev libcurl4-openssl-dev libsodium-dev cage mesa-vulkan-drivers ffmpeg
          ffmpeg -version >/dev/null
          ffprobe -version >/dev/null
      - name: macOS native build and media-test prerequisites
        if: runner.os == 'macOS'
        shell: bash
        run: |
          brew list --versions openssl@3 >/dev/null || brew install openssl@3
          test -f "$(brew --prefix openssl@3)/lib/libcrypto.a"
          brew list --versions ffmpeg >/dev/null || brew install ffmpeg
          ffmpeg -version >/dev/null
          ffprobe -version >/dev/null
      - name: Native source, SDK, tests and one executable
        shell: pwsh
        env:
          BLOOM_ARTIFACT_KEY: ${{ secrets.BLOOM_ARTIFACT_KEY }}
          HEADSPACE_SOURCE_REVISION: ${{ inputs.source_revision }}
          HEADSPACE_BUILD_RUNNER: ${{ matrix.runner }}
        run: |
          python scripts/headspace_release_build.py build --runner $env:HEADSPACE_BUILD_RUNNER "--revision=$env:HEADSPACE_SOURCE_REVISION" "--version=$env:HEADSPACE_PACKAGE_VERSION" --output "$env:RUNNER_TEMP/headspace-dist"
          exit $LASTEXITCODE
      - name: Retain one executable and bounded qualification receipts
        if: always()
        # actions/upload-artifact v4, official tag resolved 2026-10-18.
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: headspace-${{ matrix.runner }}-${{ inputs.source_revision }}
          retention-days: 3
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/headspace-dist/failure-*.aesgcm
            ${{ runner.temp }}/headspace-dist/failure-*.manifest.json
            ${{ runner.temp }}/headspace-dist/headspace-*
            ${{ runner.temp }}/headspace-dist/inventory-*.json
            ${{ runner.temp }}/headspace-dist/build-*.json
            ${{ runner.temp }}/headspace-dist/verify-*.json
