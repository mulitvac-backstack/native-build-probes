      - name: Native source, SDK, tests and compiled packages
        shell: pwsh
        env:
          HEADSPACE_SOURCE_REVISION: ${{ inputs.source_revision }}
          HEADSPACE_BUILD_RUNNER: ${{ matrix.runner }}
        run: |
          python scripts/headspace_release_build.py build --runner $env:HEADSPACE_BUILD_RUNNER "--revision=$env:HEADSPACE_SOURCE_REVISION" "--version=$env:HEADSPACE_PACKAGE_VERSION" --sdk-file "$env:RUNNER_TEMP/headspace-sdk.b64" --output "$env:RUNNER_TEMP/headspace-dist"
          exit $LASTEXITCODE
      - name: Retain only compiled packages and bounded public receipts
        if: always()
        # actions/upload-artifact v4, official tag resolved 2026-10-18.
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: headspace-${{ matrix.runner }}-${{ inputs.source_revision }}
          retention-days: 3
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/headspace-dist/headspace-*.deb
            ${{ runner.temp }}/headspace-dist/headspace-*.rpm
            ${{ runner.temp }}/headspace-dist/headspace-*.app.zip
            ${{ runner.temp }}/headspace-dist/headspace-*.dmg
